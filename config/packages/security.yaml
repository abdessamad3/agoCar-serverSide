security:
  password_hashers:
    App\Entity\Utilisateur:
      algorithm: bcrypt

  providers:
    app_user_provider:
      entity:
        class: App\Entity\Utilisateur
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    api:
      pattern: ^/api
      stateless: true
      jwt: ~

  access_control:
    # Public endpoints (no auth required)
    - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/login,    roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/refresh,  roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/logout,   roles: PUBLIC_ACCESS }

    # Public car rental website (catalog, booking submission, client registration)
    - { path: ^/api/site, roles: PUBLIC_ACCESS }

    # Frontend crash reporting — must work even before login (see
    # ErrorLogController::reportClientError / Angular GlobalErrorHandler)
    - { path: ^/api/error-log/client, roles: PUBLIC_ACCESS }

    # Client portal — authenticated clients only (ROLE_CLIENT, no admin access)
    - { path: ^/api/client-portal, roles: ROLE_CLIENT }

    # Admin/staff endpoints. NOTE: ROLE_USER is auto-granted by
    # Utilisateur::getRoles() to EVERY non-client account, including ones
    # created through the public /api/auth/register endpoint -- so it must
    # NOT be used here as "is real staff". This list matches the staff-role
    # whitelist already enforced in UtilisateurController::create()/update().
    - { path: ^/api/auth/me, roles: ROLE_USER }
    - { path: ^/api,         roles: [ROLE_STAFF, ROLE_MANAGER, ROLE_ADMIN, ROLE_ACCOUNTANT, ROLE_MECHANIC] }